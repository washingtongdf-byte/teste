<!-- VOLUME -->
<div class="col-6">
    <label for="volumes">Quantidade de Volumes *</label>
    <input
        type="number"
        id="volumes"
        min="1"
        step="1"
        placeholder="Ex.: 10"
        required
    >
</div>

<!-- PESO -->
<div class="col-6">
    <label for="peso">Peso Total (kg) *</label>
    <input
        type="number"
        id="peso"
        min="0.01"
        step="0.01"
        placeholder="Ex.: 150,50"
        required
    >
</div>

<!-- VALOR DA NOTA -->
<div class="col-6">
    <label for="valorNota">Valor da Nota Fiscal (R$) — opcional</label>
    <input
        type="number"
        id="valorNota"
        min="0"
        step="0.01"
        placeholder="Ex.: 5.000,00"
    >
</div>
